worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Map the X-Forwarded-Proto header to a variable.
    # If the header is missing, default to "https"
    map $http_x_forwarded_proto $client_https {
        default $http_x_forwarded_proto;
        ""      https;
    }

    # Optionally, you can redirect direct HTTP requests (when not coming via Cloudflare) to HTTPS.
    server {
        listen 80;
        server_name cougarcatalog.com www.cougarcatalog.com;

        # This conditional redirect checks the header. 
        # Cloudflare will send "https" in X-Forwarded-Proto for secure client connections.
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }

        # Serve frontend files

        location /books {
            proxy_pass http://localhost:8090/books;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /books/ {
            proxy_pass http://localhost:8090/books/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        # Proxy API requests to the backend container.
        # The X-Forwarded-Proto header is set based on our map.
        # Any redirects from the backend that use HTTP will be rewritten to HTTPS.
        location /customers/ {
            proxy_pass http://localhost:8090/customers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /employee/ {
            proxy_pass http://localhost:8090/employee/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /suppliers/ {
            proxy_pass http://localhost:8090/suppliers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /notifications/ {
            proxy_pass http://localhost:8090/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /cart/ {
            proxy_pass http://localhost:8090/cart/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /orders/ {
            proxy_pass http://localhost:8090/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /discounts/ {
            proxy_pass http://localhost:8090/discounts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /report/ {
            proxy_pass http://localhost:8090/report/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /reviews/ {
            proxy_pass http://localhost:8090/reviews/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location /api/ {
            proxy_pass http://localhost:8090/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $client_https;
            proxy_redirect http:// https://;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri /index.html;
        }
        
    }
}
